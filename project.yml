name: CodeLink
options:
  bundleIdPrefix: com.eidonix
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
packages:
  CodeLinkEngine:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  CodeLink:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: CodeLinkEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: code-link
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSAppleEventsUsageDescription: "code-link opens iTerm or Terminal to start Claude Code and Codex sessions."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eidonix.code-link
        # A stable identity: macOS keeps Keychain and Login Items approval
        # across rebuilds (an ad-hoc signature changes with every build).
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 342KG4SM2D
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
  CodeLinkTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/CodeLinkTests]
    dependencies:
      - target: CodeLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eidonix.code-link.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CodeLink.app/Contents/MacOS/CodeLink"
schemes:
  CodeLink:
    build:
      targets:
        CodeLink: all
        CodeLinkTests: [test]
    test:
      targets: [CodeLinkTests]
